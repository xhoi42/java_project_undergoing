# ══════════════════════════════════════════════════════════════════════════════
#  application.properties
#  Spring Boot reads this file automatically on startup.
#  It configures the database connection, JPA behaviour, and server settings.
# ══════════════════════════════════════════════════════════════════════════════

# ── Server ────────────────────────────────────────────────────────────────────
# The port your app runs on. Default is 8080.
# After starting, visit: http://localhost:8080/api/products
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

server.port=8080

# ── MySQL Database Connection ─────────────────────────────────────────────────
#
# IMPORTANT: Before running the app, create the database in MySQL:
#
#   mysql -u root -p
#   CREATE DATABASE homedecor;
#   CREATE USER 'homedecor_user'@'localhost' IDENTIFIED BY 'password123';
#   GRANT ALL PRIVILEGES ON homedecor.* TO 'homedecor_user'@'localhost';
#   FLUSH PRIVILEGES;
#
# Then run the schema.sql file in src/main/resources/schema.sql
#
spring.datasource.url=jdbc:mysql://localhost:3306/homedecor?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=homedecor_user
spring.datasource.password=password123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
#
# hibernate.ddl-auto controls what Hibernate does to your DB schema on startup:
#
#   create        → drops all tables and recreates them every startup (DESTROYS DATA)
#   create-drop   → same as create, but also drops on shutdown
#   update        → adds/modifies columns to match your entities (KEEPS DATA) ← use this
#   validate      → checks schema matches entities but changes nothing
#   none          → does nothing
#
# For development: use 'update' (keeps your data between restarts)
# For production:  use 'validate' or 'none' (never let Hibernate touch the schema)
#
spring.jpa.hibernate.ddl-auto=update

# Show the actual SQL queries Hibernate generates in the console.
# Very useful for learning and debugging. Set to false in production.
spring.jpa.show-sql=true

# Format the SQL output so it's readable (instead of one long line)
spring.jpa.properties.hibernate.format_sql=true

# Tell Hibernate we're using MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ── Jackson (JSON) ────────────────────────────────────────────────────────────
# Don't include null fields in JSON responses (cleaner output)
spring.jackson.default-property-inclusion=non_null

# Format dates as readable strings instead of timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Logging ───────────────────────────────────────────────────────────────────
# Set our own package to DEBUG so we see detailed logs during development
logging.level.com.homedecor=DEBUG

# Hide Hibernate's verbose SQL parameter binding logs (set to TRACE to see them)
logging.level.org.hibernate.type.descriptor.sql=WARN

# ── Application name (shown in logs) ─────────────────────────────────────────
spring.application.name=HomeDecorStore